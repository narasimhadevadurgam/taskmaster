name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Real Postgres service — same credentials as docker-compose so the schema
    # and tests run against a production-equivalent database.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: taskmgr
          POSTGRES_PASSWORD: taskmgr
          POSTGRES_DB: task_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskmgr -d task_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Both names point at the service DB; the app/tests read either.
      DATABASE_URL: postgres://taskmgr:taskmgr@localhost:5432/task_manager
      TEST_DATABASE_URL: postgres://taskmgr:taskmgr@localhost:5432/task_manager
      JWT_SECRET: ci-secret-at-least-16-characters-long
      LLM_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc, strict)
        run: npm run build

      - name: Apply migrations
        run: npm run migrate

      - name: Run tests (serial, real Postgres)
        run: npm test
